<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Xem thử ánh sáng skin Rubik</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #191a18; color: #eee; font: 16px system-ui, sans-serif; }
    main { max-width: 1000px; margin: auto; padding: 24px 16px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    .cubes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
    article { min-width: 0; padding: 16px; background: #252621; border: 1px solid #414439; border-radius: 14px; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    .stage { height: clamp(250px, 52vw, 380px); background: #1e201b; border-radius: 8px; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .stage p { padding: 12px; }
    @media (max-width: 600px) { .cubes { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Xem thử ánh sáng skin Rubik</h1>
    <p>Kéo bằng chuột phải hoặc chạm kéo để xoay góc nhìn. Bỏ chọn để so với ánh sáng cũ.</p>
    <label><input id="new-light" type="checkbox" checked /> Dùng ánh sáng mới</label>
    <div class="cubes">
      <article>
        <h2>Vảy Giáp Rồng</h2>
        <div class="stage" data-skin-id="epic_brushed_titanium_03"><p role="status">Đang tải Rubik…</p></div>
      </article>
      <article>
        <h2>Bánh Răng Cơ Khí</h2>
        <div class="stage" data-skin-id="epic_obsidian_chrome_05"><p role="status">Đang tải Rubik…</p></div>
      </article>
    </div>
  </main>
  <script type="module" src="/src/skin-lighting-preview.ts"></script>
</body>
</html>
